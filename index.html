<meta charset="utf-8">
<title>Logic Paint</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<body style="background:white;margin:0px;display:grid;width:100%;height:100%;grid-template-rows:auto 1fr">
    <div id="top_d" style=""></div>
    <div id="bottom_d" style="width:100%;height:100%;overflow:scroll"></div>
</body>
<script>

console.log('0.0.9')

var tau = Math.PI * 2

var view = {
    x : -22,
    y : 32,
    scale : 2,
    brush : 'wire',
    speed : 0.2,
    prev_x : 0,
    prev_y : 0,
    box : null
}

var things = {
    and_gate : { on : [0, 0, 255], off : [0, 0, 128], big: true },
    // and_gate : { on : [255, 0, 0], off : [128, 0, 0], big: true },
    or_gate : { on : [255, 128, 0], off : [128, 64, 0], big: true },
    nand_gate : { on : [255, 0, 255], off : [128, 0, 128], big: true },
    wire : { on : [255, 255, 0], off : [80, 80, 0] },
    cross_gate : { on : [0, 0, 0], off : [0, 0, 0] },
    toggle : { on : [0, 255, 255], off : [0, 128, 128], big: true },
    small_toggle : { on : [0, 255, 254], off : [0, 128, 127] }
}

var code_to_thing = {}
Object.entries(things).forEach(([k, v], i) => {
    v.code = i + 1
    code_to_thing[v.code] = k
})

var dpr = window.devicePixelRatio

var W = 1024
var H = 1024

var c = document.createElement('canvas')
c.width = W
c.height = H
c.style.width = (W * view.scale)/devicePixelRatio + 'px'
c.style.height = (H * view.scale)/devicePixelRatio + 'px'
c.style['image-rendering'] = 'pixelated'
bottom_d.append(c)
window.onresize = () => {
    let sd = bottom_d
    sd.scrollLeft = (sd.scrollWidth - sd.clientWidth) / 2
    sd.scrollTop = (sd.scrollHeight - sd.clientHeight) / 2    
}
window.onresize()

var gl = c.getContext('webgl2')

var vs = createShader(gl, gl.VERTEX_SHADER, `#version 300 es
in vec4 a_position;
void main() {
    gl_Position = a_position;
}
`)

var sss = `#version 300 es
precision mediump float;

uniform sampler2D u_image;
uniform vec4 u_red_box;

out vec4 outColor;

float lerp(float t0, float v0, float t1, float v1, float t) {
    return (t - t0) * (v1 - v0) / (t1 - t0) + v0;
}

void main() {
    if ((int(gl_FragCoord.x) % 2 == 0) == (int(gl_FragCoord.y) % 2 == 0)) outColor = vec4(0.0, 32.0/255.0, 0.0, 1.0);
    else outColor = vec4(0.0, 40.0/255.0, 0.0, 1.0);

    float w = float(${W});
    float h = float(${H});
    for (int dy = 0; dy <= 2; dy++) {
        for (int dx = -2; dx <= 0; dx++) {
            float x = gl_FragCoord.x + float(dx);
            float y = gl_FragCoord.y + float(dy);
            vec4 t = texture(u_image, vec2(x/w, y/h));

            ${Object.entries(things).map(([k, x], i) => `if (${!x.big ? 'dx == 0 && dy == 0 && ' : ''} abs(t.x - ${i + 1}.0/255.0) < 0.0001) outColor = t.y > 0.0 ? vec4(${x.on.map(x => (x/255).toFixed(3)).join(',')}, 1.0) : vec4(${x.off.map(x => (x/255).toFixed(3)).join(',')}, 1.0);`).join('\n')}

            if (dx == 0 && dy == 0 && t.z > 0.0) outColor = t.y > 0.0 ? vec4(1.0, 1.0, 0.75, 1.0) : vec4(0.5, 0.5, 0.0, 1.0);
        }
    }

    if (int(gl_FragCoord.x) >= int(u_red_box.x) &&
        int(gl_FragCoord.y) >= int(u_red_box.y) &&
        int(gl_FragCoord.x) <= int(u_red_box.z) &&
        int(gl_FragCoord.y) <= int(u_red_box.w)) outColor.r = outColor.r + 0.5;
}
`

var fs = createShader(gl, gl.FRAGMENT_SHADER, sss)

var sss = `#version 300 es
precision mediump float;

uniform sampler2D u_image;
uniform float iteration;

out vec4 outColor;

void main() {
    float w = float(${W});
    float h = float(${H});
    float x = gl_FragCoord.x;
    float y = gl_FragCoord.y;

    vec4 tt = texture(u_image, vec2(x/w, y/h));
    vec4 t;

    if (tt.x == 0.0) {
    } else if (abs(tt.x - ${things.wire.code.toFixed(1)}/255.0) < 0.0001 && tt.z > 0.0) {
        tt.z = 0.0;
    } else if (abs(tt.x - ${things.wire.code.toFixed(1)}/255.0) < 0.0001) {
                
        bool flip = false;

        ${[[0, 1], [1, 0], [0, -1], [-1, 0]].map(x => `
            t = texture(u_image, vec2((x + ${x[0].toFixed(1)})/w, (y + ${x[1].toFixed(1)})/h));
            if (abs(t.x - ${things.wire.code.toFixed(1)}/255.0) < 0.0001 && (t.z > 0.0 || t.y == 0.0) && t.y != tt.y) {
                flip = true;
            } else if (abs(t.x - ${things.cross_gate.code.toFixed(1)}/255.0) < 0.0001) {
                t = texture(u_image, vec2((x + 2.0*${x[0].toFixed(1)})/w, (y + 2.0*${x[1].toFixed(1)})/h));
                if (abs(t.x - ${things.wire.code.toFixed(1)}/255.0) < 0.0001 && (t.z > 0.0 || t.y == 0.0) && t.y != tt.y) flip = true;
            }
        `).join('\n')}

        ${[[-1, 3], [1, 1], [-1, -1], [-3, 1]].map(x => `
            t = texture(u_image, vec2((x + ${x[0].toFixed(1)})/w, (y + ${x[1].toFixed(1)})/h));
            if (t.w > 0.0 && t.y != tt.y) flip = true;
        `).join('\n')}
        ${[[0, 1], [1, 0], [0, -1], [-1, 0]].map(x => `
            t = texture(u_image, vec2((x + ${x[0].toFixed(1)})/w, (y + ${x[1].toFixed(1)})/h));
            if (abs(t.x - ${things.small_toggle.code.toFixed(1)}/255.0) < 0.0001 && t.y != tt.y) flip = true;
        `).join('\n')}

        if (flip) {
            tt.y = tt.y > 0.0 ? 0.0 : 1.0;
            tt.z = 1.0;
        } else tt.z = 0.0;

    } else if (abs(tt.x - ${things.cross_gate.code.toFixed(1)}/255.0) < 0.0001) {
    } else if (abs(tt.x - ${things.toggle.code.toFixed(1)}/255.0) < 0.0001) {
    } else if (abs(tt.x - ${things.small_toggle.code.toFixed(1)}/255.0) < 0.0001) {
    } else {
        int all_inputs = 0;
        int on_inputs = 0;

        ${[[0, 1], [2, 1], [3, 0], [3, -2], [0, -3], [2, -3], [-1, 0], [-1, -2]].map(x => `
            t = texture(u_image, vec2((x + ${x[0].toFixed(1)})/w, (y + ${x[1].toFixed(1)})/h));
            if (abs(t.x - ${things.wire.code.toFixed(1)}/255.0) < 0.0001) {
                all_inputs++;
                if (t.y > 0.0) on_inputs++;
            }
        `).join('\n')}

        if (abs(tt.x - ${things.and_gate.code.toFixed(1)}/255.0) < 0.0001) {
            tt.y = on_inputs == all_inputs ? 1.0 : 0.0;
        } else if (abs(tt.x - ${things.or_gate.code.toFixed(1)}/255.0) < 0.0001) {
            tt.y = on_inputs > 0 ? 1.0 : 0.0;
        } else if (abs(tt.x - ${things.nand_gate.code.toFixed(1)}/255.0) < 0.0001) {
            tt.y = on_inputs != all_inputs ? 1.0 : 0.0;
        }
    }
    outColor = tt;
}
`

var fs2 = createShader(gl, gl.FRAGMENT_SHADER, sss)

var program = createProgram(gl, vs, fs)
gl.useProgram(program)
var a_position = gl.getAttribLocation(program, 'a_position')

var positionBuffer = gl.createBuffer()

var u_image = gl.getUniformLocation(program, 'u_image')
gl.uniform1i(u_image, 0)

var u_red_box = gl.getUniformLocation(program, 'u_red_box')

gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,
    -1, 3,
    3, -1,
]), gl.STATIC_DRAW)

gl.viewport(0, 0, gl.canvas.width, gl.canvas.height)
gl.clearColor(0, 0, 0, 0)
gl.clear(gl.COLOR_BUFFER_BIT)

gl.enableVertexAttribArray(a_position)

gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer)
gl.vertexAttribPointer(a_position, 2, gl.FLOAT, false, 0, 0)





var f = new Uint8Array(W * H * 4)

var targetTexture = gl.createTexture()
gl.activeTexture(gl.TEXTURE0)

gl.bindTexture(gl.TEXTURE_2D, targetTexture)
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, f)

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT)




var program2 = createProgram(gl, vs, fs2)
gl.useProgram(program2)

var iteration_num = 0
var iteration = gl.getUniformLocation(program2, 'iteration')


var a_position = gl.getAttribLocation(program2, 'a_position')
gl.enableVertexAttribArray(a_position)
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer)
gl.vertexAttribPointer(a_position, 2, gl.FLOAT, false, 0, 0)

gl.uniform1i(gl.getUniformLocation(program2, 'u_image'), 0);

var targetTexture2 = gl.createTexture()
//gl.activeTexture(gl.TEXTURE1)

gl.bindTexture(gl.TEXTURE_2D, targetTexture2)
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null)

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT)



var fb = gl.createFramebuffer()
gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, targetTexture2, 0)

var fb2 = gl.createFramebuffer()
gl.bindFramebuffer(gl.FRAMEBUFFER, fb2)
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, targetTexture, 0)

var last_time = performance.now()
var time_helper = 0

var dirty = true

loop()
function loop() {
    var cur_time = performance.now()
    var dt = cur_time - last_time
    last_time = cur_time

    time_helper += dt
    if (time_helper > 1000) time_helper = 1000
    var time_per_step = view.speed == 0 ? Infinity : 1/view.speed
    if (time_per_step == Infinity) time_helper = 0
    while (time_helper > time_per_step) {
        gl.bindTexture(gl.TEXTURE_2D, targetTexture)
        
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
        gl.useProgram(program2)
        gl.uniform1f(iteration, iteration_num)
        iteration_num++
        
        gl.drawArrays(gl.TRIANGLES, 0, 3)
        
        var save = targetTexture
        targetTexture = targetTexture2
        targetTexture2 = save
        
        var save = fb
        fb = fb2
        fb2 = save

        time_helper -= time_per_step

        dirty = true
    }

    if (dirty) {
        dirty = false
        gl.bindTexture(gl.TEXTURE_2D, targetTexture)
        
        gl.bindFramebuffer(gl.FRAMEBUFFER, null)
        gl.useProgram(program)

        if (view.brush == 'box' && view.box) gl.uniform4f(u_red_box, view.box[0], view.box[1], view.box[2] ?? view.box[0], view.box[3] ?? view.box[1])
        else gl.uniform4f(u_red_box, 0, 0, -1, -1)

        gl.drawArrays(gl.TRIANGLES, 0, 3)
        if (window.draw_overlay) draw_overlay()
    } else if (window.overlay_dirty && window.draw_overlay) draw_overlay()

    window.requestAnimationFrame(loop)
}

function each(x, cb) {
    Object.entries(x).forEach(([k, v]) => cb(v, k))
}

// zoom limits: from the whole board fitting in ~256 device px, up to 100
// screen pixels per cell
function clamp_scale(scale) {
    return Math.min(100 * devicePixelRatio, Math.max(0.25, scale))
}

function set_scale(new_zoom) {
    view.scale = new_zoom
    var c = bottom_d.firstChild
    c.style.width = (W * view.scale)/devicePixelRatio + 'px'
    c.style.height = (H * view.scale)/devicePixelRatio + 'px'
}

function set_zoom(new_zoom) {
    var sd = bottom_d
    var x = (sd.scrollLeft + sd.clientWidth / 2) / sd.scrollWidth
    var y = (sd.scrollTop + sd.clientHeight / 2) / sd.scrollHeight

    set_scale(new_zoom)

    sd.scrollLeft = x * sd.scrollWidth - sd.clientWidth / 2
    sd.scrollTop = y * sd.scrollHeight - sd.clientHeight / 2        
}

function draw_palette() {
    var d = document.createElement('div')
    d.style.lineHeight = '0'

    function drawMagnifyingGlass(c, g) {
        g.beginPath()
        g.moveTo(17 * dpr, 17 * dpr)
        g.lineTo(33 * dpr, 33 * dpr)
        g.lineWidth = 2 * dpr
        g.strokeStyle = 'black'
        g.stroke()

		g.beginPath()
		g.arc(17.5 * dpr, 17.5 * dpr, 10 * dpr, 0, 2*Math.PI)
		g.fillStyle = 'lightblue'
		g.fill()
        g.strokeStyle = 'black'
		g.stroke()
    }

    createZoomInButton()
    function createZoomInButton() {
        var b = document.createElement('div')
        b.style.background = 'white'
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'
        b.onclick = () => set_zoom(view.scale * 2)

        var c = document.createElement('canvas')
        c.width = 40 * dpr
        c.height = 40 * dpr
        c.style.width = '40px'
        c.style.height = '40px'
        var g = c.getContext('2d')

        drawMagnifyingGlass(c, g)

		g.fillStyle = 'black'
		g.fillRect(12 * dpr, 16 * dpr, 11 * dpr, 3 * dpr)
		g.fillRect(16 * dpr, 12 * dpr, 3 * dpr, 11 * dpr)

        b.append(c)
        d.append(b)
    }
    
    createZoomOutButton()
    function createZoomOutButton() {
        var b = document.createElement('div')
        b.style.background = 'white'
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'
        b.onclick = () => set_zoom(view.scale / 2)

        var c = document.createElement('canvas')
        c.width = 40 * dpr
        c.height = 40 * dpr
        c.style.width = '40px'
        c.style.height = '40px'
        var g = c.getContext('2d')

        drawMagnifyingGlass(c, g)

		g.fillStyle = 'black'
		g.fillRect(12 * dpr, 16 * dpr, 11 * dpr, 3 * dpr)

        b.append(c)
        d.append(b)
    }

    createSpeedSlider()
    function createSpeedSlider() {
        var x = make_html(`<input style="margin:0px;height:40px" type="range" min="0" max="100" value="90" step="1"></input>`)
        x.value = view.speed * (1*x.max)
        x.oninput = () => view.speed = (1*x.value) / (1*x.max)
        d.append(x)
    }

    var last_save_url = null
    function createSaveButton() {
        var b = document.createElement('div')
        b.style.background = 'white'
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'

        var cc = document.createElement('canvas')
        cc.width = 40 * dpr
        cc.height = 40 * dpr
        cc.style.width = '40px'
        cc.style.height = '40px'
        var g = cc.getContext('2d')

        g.fillStyle = 'black'
        g.beginPath()
        g.moveTo(10 * dpr, 20 * dpr)
        g.lineTo(30 * dpr, 20 * dpr)
        g.lineTo(20 * dpr, 30 * dpr)
        g.fill()
        g.fillRect(18 * dpr, 10 * dpr, 4 * dpr, 10 * dpr)
        g.fillRect(10 * dpr, 29 * dpr, 20 * dpr, 1 * dpr)

        b.onclick = function () {
            gl.bindTexture(gl.TEXTURE_2D, targetTexture)
            gl.bindFramebuffer(gl.FRAMEBUFFER, null)
            gl.useProgram(program)
            gl.uniform4f(u_red_box, 0, 0, -1, -1)
            gl.drawArrays(gl.TRIANGLES, 0, 3)

            var a = make_html(`<a></a>`)
            a.setAttribute('href', c.toDataURL())
            a.setAttribute('download', 'chip.png')
            a.style.display = 'none'
            document.body.appendChild(a)
            a.click()
            document.body.removeChild(a)
        }

        b.append(cc)
        d.append(b)
    }
    createSaveButton()

    function createUploadButton() {
        var b = document.createElement('div')
        b.style.background = 'white'
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'

        var c = document.createElement('canvas')
        c.width = 40 * dpr
        c.height = 40 * dpr
        c.style.width = '40px'
        c.style.height = '40px'
        var g = c.getContext('2d')

        g.fillStyle = 'black'
        g.beginPath()
        g.moveTo(10 * dpr, 20 * dpr)
        g.lineTo(30 * dpr, 20 * dpr)
        g.lineTo(20 * dpr, 10 * dpr)
        g.fill()
        g.fillRect(18 * dpr, 20 * dpr, 4 * dpr, 10 * dpr)
        g.fillRect(10 * dpr, 10 * dpr, 20 * dpr, 1 * dpr)

        b.onclick = function () {
            var inp = document.createElement('input')
            inp.setAttribute('type', 'file')
            inp.onchange = async function () {
                if (this.files.length == 1) {
                    var r = new FileReader()
                    var e = await new Promise(done => {
                        r.onload = done
                        r.readAsDataURL(this.files[0])
                    })
                    await load_img(r.result)
                }
                document.body.removeChild(inp)
            }
            inp.style.display = 'none'
            document.body.append(inp)
            inp.click()
        }

        b.append(c)
        d.append(b)
    }
    createUploadButton()

    function createPowerResetButton() {
        var b = document.createElement('div')
        b.style.background = 'white'
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'

        var c = document.createElement('canvas')
        c.width = 40 * dpr
        c.height = 40 * dpr
        c.style.width = '40px'
        c.style.height = '40px'
        var g = c.getContext('2d')

        g.strokeStyle = 'black'
        g.beginPath()
        g.lineWidth = 3 * dpr
        g.arc(20 * dpr, 20 * dpr, 8 * dpr, 3/4*tau + 1/10*tau, 3/4*tau - 1/10*tau)
        g.moveTo(20 * dpr, 10 * dpr)
        g.lineTo(20 * dpr, 19 * dpr)
        g.lineCap = 'round'
        g.stroke()

        b.onclick = function () {
            draw_on_chip(f => {
                for (var i = 1; i < f.length; i += 4) if (f[i - 1] != things.toggle.code && f[i - 1] != things.small_toggle.code) f[i] = 0
            }, { history : false })
        }

        b.append(c)
        d.append(b)
    }
    createPowerResetButton()

    var radio_buttons = {}
    
    function create_radio_button(drawOn, drawOff, brush, clickRightAway) {
        var b = document.createElement('div')
        b.style.display = 'inline-block'
        b.style.width = '40px'
        b.style.height = '40px'

        var c = document.createElement('canvas')
        c.width = 40
        c.height = 40
        c.style['image-rendering'] = 'pixelated'
        var g = c.getContext('2d')
        b.append(c)

        b.onclick = function () {
            view.brush = brush
            bottom_d.firstChild.style.cursor = brush == 'hand' ? 'grab' : ''
            each(radio_buttons, function (x, k) {
            	if (k != brush) x.drawOff(x.c, x.g)
            })
            drawOn(c, g)
        }

        radio_buttons[brush] = { c : c, g : g, drawOff : drawOff }
        if (clickRightAway) b.onclick()
        else drawOff(c, g)
        d.append(b)
    }

    function do_unselected_background(g) {
        // g.fillStyle = 'rgb(0, 40, 0)'
        g.fillStyle = 'rgb(255, 255, 255)'
        g.fillRect(0, 0, 40, 40)
    }
    
    create_radio_button(function (c, g) {
    	g.fillStyle = 'rgb(255, 255, 0)'
    	g.fillRect(0, 0, 40, 40)
    	g.fillStyle = 'rgb(0, 40, 0)'
    	g.fillRect(4, 4, 32, 32)

        g.fillStyle = 'rgb(255, 255, 0)'
    	g.fillRect(10, 18, 20, 4)
    }, function (c, g) {
    	do_unselected_background(g)

        g.fillStyle = 'rgb(128, 128, 0)'
    	g.fillRect(10, 18, 20, 4)
    }, 'wire')
    create_radio_button(function (c, g) {
    	g.fillStyle = 'rgb(255, 255, 0)'
    	g.fillRect(0, 0, 40, 40)
    	g.fillStyle = 'rgb(0, 40, 0)'
    	g.fillRect(4, 4, 32, 32)

        g.fillStyle = 'rgb(255, 255, 0)'
    	g.fillRect(10, 18, 20, 4)
    	g.fillRect(18, 14, 4, 12)
    	g.fillStyle = 'rgb(0, 0, 0)'
    	g.fillRect(18, 18, 4, 4)
    }, function (c, g) {
    	do_unselected_background(g)

        g.fillStyle = 'rgb(128, 128, 0)'
    	g.fillRect(10, 18, 20, 4)
    	g.fillRect(18, 14, 4, 12)
    	g.fillStyle = 'rgb(0, 0, 0)'
    	g.fillRect(18, 18, 4, 4)
    }, 'cross_gate')
    create_radio_button(function (c, g) {
    	g.fillStyle = 'rgb(255, 255, 0)'
    	g.fillRect(0, 0, 40, 40)
    	g.fillStyle = 'rgb(0, 40, 0)'
    	g.fillRect(4, 4, 32, 32)
        g.fillStyle = 'rgb(255, 128, 0)'
        g.fillRect(14, 14, 12, 12)
        g.fillStyle = 'rgb(255, 255, 0)'
        g.fillRect(10, 14, 4, 4)
        g.fillRect(26, 18, 4, 4)
        g.fillStyle = 'rgb(80, 80, 0)'
        g.fillRect(10, 22, 4, 4)
    }, function (c, g) {
    	do_unselected_background(g)

        g.fillStyle = 'rgb(128, 64, 0)'
        g.fillRect(14, 14, 12, 12)
        g.fillStyle = 'rgb(80, 80, 0)'

async function load_img(url, history = true) {
    var im = new Image()
    await new Promise(done => {
        im.onload = done
        im.src = url
    })

    var c = document.createElement('canvas')
    c.width = im.width
    c.height = im.height
    var g = c.getContext('2d')
    g.drawImage(im, 0, 0, im.width, im.height)
    var data = g.getImageData(0, 0, im.width, im.height).data

    var color_to_thing_on = {}
    Object.entries(things).forEach(([k, v]) => color_to_thing_on[v.on.join(',')] = k)

    var color_to_thing_off = {}
    Object.entries(things).forEach(([k, v]) => color_to_thing_off[v.off.join(',')] = k)
    
    draw_on_chip(f => {
        for (var y = 0; y < im.height; y++) {
            for (var x = 0; x < im.width; x++) {
                for (var i = 0; i < 4; i++) f[x*4 + (H - y - 1)*W*4 + i] = 0

                if (data[x*4 + y*im.width*4 + 3] == 0) continue

                if (data[x*4 + y*im.width*4 + 0] == 0 && data[x*4 + y*im.width*4 + 1] == 0 && data[x*4 + y*im.width*4 + 2] == 0) {
                    f[x*4 + (H - y - 1)*W*4 + 0] = things.cross_gate.code
                } else if (data[x*4 + y*im.width*4 + 0] != 0 && data[x*4 + y*im.width*4 + 0] == data[x*4 + y*im.width*4 + 1]) {

                    f[x*4 + (H - y - 1)*W*4 + 0] = things.wire.code
                    f[x*4 + (H - y - 1)*W*4 + 1] = data[x*4 + y*im.width*4 + 0] == 255 ? 255 : 0
                    f[x*4 + (H - y - 1)*W*4 + 2] = (data[x*4 + y*im.width*4 + 2] || (data[x*4 + y*im.width*4 + 0] < 255 && data[x*4 + y*im.width*4 + 0] >= 128)) ? 255 : 0
                } else {
                    var color = [data[x*4 + y*im.width*4 + 0], data[x*4 + y*im.width*4 + 1], data[x*4 + y*im.width*4 + 2]]

                    // work here
                    // if (color[0] == 0 && color[1] == 0 && color[2] == 255) {
                    //     color = [255, 0, 0]
                    // }
                    // if (color[0] == 0 && color[1] == 0 && color[2] == 128) {
                    //     color = [128, 0, 0]
                    // }

                    var thing = color_to_thing_on[color.join(',')]
                    if (thing) {
                        f[x*4 + (H - y - 1)*W*4 + 0] = things[thing].code
                        f[x*4 + (H - y - 1)*W*4 + 1] = 255
                        f[x*4 + (H - y - 1)*W*4 + 3] = thing.big ? 255 : 0
                    }

                    var thing = color_to_thing_off[color.join(',')]
                    if (thing) {
                        f[x*4 + (H - y - 1)*W*4 + 0] = things[thing].code
                        f[x*4 + (H - y - 1)*W*4 + 1] = 0
                        f[x*4 + (H - y - 1)*W*4 + 3] = thing.big ? 255 : 0
                    }
                }
            }
        }

        for (var y = 0; y < im.height; y++) {
            for (var x = 0; x < im.width; x++) {
                let thing = code_to_thing[f[x*4 + (H - y - 1)*W*4 + 0]]
                if (things[thing]?.big) {
                    for (var dy = 0; dy < 3; dy++)
                        for (var dx = 0; dx < 3; dx++)
                            if (dx > 0 || dy > 0)
                                for (var i = 0; i < 4; i++)
                                    f[(x + dx)*4 + (H - (y + dy) - 1)*W*4 + i] = 0
                }
            }
        }                        
    }, { history : history })
}


// pointer input (mouse, pen and touch):
// - a tap or click does what a click always did
// - dragging with the wire brush draws a straight wire; moving well off the
//   line turns a corner
// - dragging with the delete brush erases along the path
// - dragging with the box brush selects a rectangle
// - dragging with any other brush, or with the hand tool, pans
// - two fingers pan and pinch-zoom; the board stays stuck under the fingers
c.style['touch-action'] = 'none'

var pointers = new Map()
var stroke = null
var pinch = null
var gesture_lock = false

function pointer_mid() {
    var ps = [...pointers.values()]
    return {
        x : (ps[0].x + ps[1].x) / 2,
        y : (ps[0].y + ps[1].y) / 2,
        dist : Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y)
    }
}

function cell_size_css() {
    return view.scale / devicePixelRatio
}

// the board position (in cells, unrounded) under a point on the screen
function board_point(client_x, client_y) {
    var r = c.getBoundingClientRect()
    return { x : (client_x - r.left) / cell_size_css(), y : (client_y - r.top) / cell_size_css() }
}

// scroll so that board point p ends up under the given screen point
function put_board_point(p, client_x, client_y) {
    var r = c.getBoundingClientRect()
    bottom_d.scrollLeft += r.left + p.x * cell_size_css() - client_x
    bottom_d.scrollTop += r.top + p.y * cell_size_css() - client_y
}

function start_pinch() {
    var m = pointer_mid()
    pinch = { dist : m.dist, scale : view.scale, anchor : board_point(m.x, m.y) }
}

function start_pan(id, x, y) {
    stroke = { id : id, mode : 'pan', anchor : board_point(x, y) }
}

c.addEventListener('pointerdown', function (e) {
    if (e.pointerType == 'mouse' && e.button != 0) return
    try { c.setPointerCapture(e.pointerId) } catch (err) {}
    pointers.set(e.pointerId, { x : e.clientX, y : e.clientY })

    if (pointers.size == 2) {
        // a second finger means pan/zoom, not drawing
        if (stroke) cancel_stroke()
        gesture_lock = true
        start_pinch()
        return
    }
    if (pointers.size > 2 || gesture_lock) return

    stroke = {
        id : e.pointerId,
        start_x : e.clientX,
        start_y : e.clientY,
        start_pos : getRelPos(c, e),
        start : pos_to_cell(getRelPos(c, e)),
        shift : e.shiftKey,
        mode : 'pending'
    }
    e.preventDefault()
})

c.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return
    pointers.set(e.pointerId, { x : e.clientX, y : e.clientY })

    if (pinch && pointers.size == 2) {
        var m = pointer_mid()
        if (pinch.dist > 0 && m.dist > 0) {
            var scale = clamp_scale(pinch.scale * m.dist / pinch.dist)
            if (scale != view.scale) set_scale(scale)
        }
        put_board_point(pinch.anchor, m.x, m.y)
        return
    }

    if (!stroke || stroke.id != e.pointerId) return

    if (stroke.mode == 'pan') {
        put_board_point(stroke.anchor, e.clientX, e.clientY)
        return
    }

    if (stroke.mode == 'pending') {
        var moved = Math.hypot(e.clientX - stroke.start_x, e.clientY - stroke.start_y)
        if (moved < (e.pointerType == 'mouse' ? 3 : 8)) return
        if (stroke.shift) return
        if (!start_stroke()) {
            // brushes that don't paint by dragging pan instead
            start_pan(stroke.id, stroke.start_x, stroke.start_y)
            put_board_point(stroke.anchor, e.clientX, e.clientY)
            return
        }
    }

    stroke.target = pos_to_cell(getRelPos(c, e))
    if (!stroke.frame) stroke.frame = requestAnimationFrame(continue_stroke)
})

function pointer_end(e) {
    if (!pointers.has(e.pointerId)) return
    pointers.delete(e.pointerId)
    if (pinch && pointers.size == 1) {
        // lifting one finger of a pinch: keep panning with the other
        pinch = null
        var [id, p] = [...pointers][0]
        start_pan(id, p.x, p.y)
    }
    if (pointers.size == 0) gesture_lock = false

    if (!stroke || stroke.id != e.pointerId) return
    var s = stroke
    if (s.mode == 'pan') {
        stroke = null
        return
    }
    if (s.mode == 'pending') {
        stroke = null
        if (e.type == 'pointerup') my_on_mouse_up(s.start_pos, e)
        return
    }
    if (e.type == 'pointerup') {
        s.target = pos_to_cell(getRelPos(c, e))
        continue_stroke()
        finish_stroke()
    } else cancel_stroke()
}
c.addEventListener('pointerup', pointer_end)
c.addEventListener('pointercancel', pointer_end)

function start_stroke() {
    var s = stroke
    if (view.brush == 'hand') return false
    if (view.brush == 'wire' || view.brush == 'delete') {
        s.mode = view.brush
        s.anchor = s.start
        s.end = s.start
        s.axis = null
        s.done = new Set()
        begin_history_group()
        draw_on_chip(f => paint_cell(f, s.start.x, s.start.y, null))
    } else if (view.brush == 'box') {
        s.mode = 'box'
        view.box = [s.start.x, s.start.y]
    } else {
        // other brushes place one piece on a click; a drag pans
        return false
    }
    return true
}

function paint_cell(f, x, y, direction) {
    if (x < 1 || x >= W - 1 || y < 1 || y >= H - 1) return
    var key = x + y * W
    if (stroke.done.has(key)) return
    stroke.done.add(key)
    if (stroke.mode == 'wire') {
        // keep existing crossings, and don't reset the wire a stroke starts on
        var code = f[x * 4 + y * W * 4]
        if (code == things.cross_gate.code) return
        if (code == things.wire.code) {
            // an existing wire is left alone unless this stroke crosses it
            var crossing = direction == 'horz' ?
                f[x * 4 + (y - 1) * W * 4] == things.wire.code && f[x * 4 + (y + 1) * W * 4] == things.wire.code :
                direction == 'vert' &&
                f[(x - 1) * 4 + y * W * 4] == things.wire.code && f[(x + 1) * 4 + y * W * 4] == things.wire.code
            if (!crossing) return
        }
        add_wire(f, x, y, direction)
    } else erase_at(f, x, y)
}

function continue_stroke() {
    var s = stroke
    if (!s) return
    if (s.frame) cancelAnimationFrame(s.frame)
    s.frame = null
    var t = s.target
    if (!t) return

    if (s.mode == 'box') {
        view.box = [
            Math.min(s.start.x, t.x),
            Math.min(s.start.y, t.y),
            Math.max(s.start.x, t.x),
            Math.max(s.start.y, t.y)
        ]
        dirty = true
        return
    }

    if (s.mode == 'delete') {
        // erase every cell along the path from the last point
        draw_on_chip(f => {
            var n = Math.max(Math.abs(t.x - s.end.x), Math.abs(t.y - s.end.y))
            for (var i = 1; i <= n; i++)
                paint_cell(f, Math.round(s.end.x + (t.x - s.end.x) * i / n), Math.round(s.end.y + (t.y - s.end.y) * i / n), null)
        })
        s.end = t
        return
    }

    // wire: follow one axis from the anchor; if the pointer strays far
    // enough off that axis, turn a corner at the current end of the line
    var dx = t.x - s.anchor.x
    var dy = t.y - s.anchor.y
    if (!s.axis) {
        if (dx == 0 && dy == 0) return
        s.axis = Math.abs(dx) >= Math.abs(dy) ? 'horz' : 'vert'
    }
    var turn = Math.max(2, Math.round(8 / cell_size_css()))
    if (s.axis == 'horz' && Math.abs(dy) >= turn) {
        s.anchor = { x : s.end.x, y : s.anchor.y }
        s.axis = 'vert'
    } else if (s.axis == 'vert' && Math.abs(dx) >= turn) {
        s.anchor = { x : s.anchor.x, y : s.end.y }
        s.axis = 'horz'
    }
    var target = s.axis == 'horz' ? { x : t.x, y : s.anchor.y } : { x : s.anchor.x, y : t.y }
    draw_on_chip(f => {
        if (s.axis == 'horz') {
            var step = target.x >= s.end.x ? 1 : -1
            for (var x = s.end.x; x != target.x + step; x += step) paint_cell(f, x, target.y, 'horz')
        } else {
            var step = target.y >= s.end.y ? 1 : -1
            for (var y = s.end.y; y != target.y + step; y += step) paint_cell(f, target.x, y, 'vert')
        }
    })
    s.end = target
}

function finish_stroke() {
    var s = stroke
    stroke = null
    if (s.frame) cancelAnimationFrame(s.frame)
    if (s.mode == 'box') {
        if (view.box.length == 4) {
            view.copy = []
            draw_on_chip(f => {
                for (var x = view.box[0]; x <= view.box[2]; x++)
                    for (var y = view.box[1]; y <= view.box[3]; y++)
                        for (var i = 0; i < 4; i++)
                            view.copy.push(f[x*4 + y*W*4 + i])
            }, { history : false })
        }
        return
    }
    end_history_group()
    // so a following shift-click continues from the end of this stroke
    view.prev_x = s.end.x
    view.prev_y = s.end.y
}

function cancel_stroke() {
    var s = stroke
    stroke = null
    if (s.frame) cancelAnimationFrame(s.frame)
    if (s.mode == 'box') view.box = null
    else if (s.mode == 'wire' || s.mode == 'delete') cancel_history_group()
    dirty = true
}

// undo history: each entry lists the pixels an edit changed, with their
// before and after values, so undoing only touches those pixels and the
// rest of the running circuit keeps its state
var undo_stack = []
var redo_stack = []
var history_bytes = 0
var max_history_bytes = 64 * 1024 * 1024
var draw_depth = 0

function draw_on_chip(cb, options) {
    var record = draw_depth == 0 && !(options && options.history == false)
    draw_depth++

    gl.bindFramebuffer(gl.FRAMEBUFFER, fb2)
    gl.readPixels(0, 0, gl.canvas.width, gl.canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, f)

    var before = record ? f.slice() : null

    try {
        cb(f)
    } finally {
        draw_depth--
    }

    gl.activeTexture(gl.TEXTURE0)
    gl.bindTexture(gl.TEXTURE_2D, targetTexture)
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, f)

    dirty = true

    if (record) record_edit(before, f)
}

// while a group is open (e.g. during a drag stroke), edits are merged into
// it, so the whole stroke undoes as one step
var history_group = null

function begin_history_group() {
    history_group = new Map()
}

function end_history_group() {
    var group = history_group
    history_group = null
    var changed = [...group].filter(([i, v]) => v[0] != v[1])
    if (!changed.length) return
    var edit = {
        index : new Uint32Array(changed.length),
        before : new Uint32Array(changed.length),
        after : new Uint32Array(changed.length)
    }
    changed.forEach(([i, v], j) => {
        edit.index[j] = i
        edit.before[j] = v[0]
        edit.after[j] = v[1]
    })
    push_edit(edit)
}

function cancel_history_group() {
    var group = history_group
    history_group = null
    draw_on_chip(f => {
        var p = new Uint32Array(f.buffer, f.byteOffset, W * H)
        group.forEach((v, i) => p[i] = v[0])
    }, { history : false })
}

function record_edit(before, after) {
    var b = new Uint32Array(before.buffer)
    var a = new Uint32Array(after.buffer, after.byteOffset, W * H)

    if (history_group) {
        for (var i = 0; i < b.length; i++) if (b[i] != a[i]) {
            var v = history_group.get(i)
            if (v) v[1] = a[i]
            else history_group.set(i, [b[i], a[i]])
        }
        return
    }

    var count = 0
    for (var i = 0; i < b.length; i++) if (b[i] != a[i]) count++
    if (!count) return

    var edit = {
        index : new Uint32Array(count),
        before : new Uint32Array(count),
        after : new Uint32Array(count)
    }
    var j = 0
    for (var i = 0; i < b.length; i++) if (b[i] != a[i]) {
        edit.index[j] = i
        edit.before[j] = b[i]
        edit.after[j] = a[i]
        j++
    }
    push_edit(edit)
}

function push_edit(edit) {
    var count = edit.index.length
    undo_stack.push(edit)
    history_bytes += count * 12
    redo_stack.forEach(e => history_bytes -= e.index.length * 12)
    redo_stack = []
    while (history_bytes > max_history_bytes && undo_stack.length > 1)
        history_bytes -= undo_stack.shift().index.length * 12
}

function apply_edit(edit, values) {
    draw_on_chip(f => {
        var p = new Uint32Array(f.buffer, f.byteOffset, W * H)
        for (var j = 0; j < edit.index.length; j++) p[edit.index[j]] = values[j]
    }, { history : false })
}

function undo() {
    if (history_group) return
    var edit = undo_stack.pop()
    if (!edit) return
    apply_edit(edit, edit.before)
    redo_stack.push(edit)
}

function redo() {
    if (history_group) return
    var edit = redo_stack.pop()
    if (!edit) return
    apply_edit(edit, edit.after)
    undo_stack.push(edit)
}

document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return
    var key = e.key.toLowerCase()
    if (key == 'z' && !e.shiftKey) undo()
    else if ((key == 'z' && e.shiftKey) || key == 'y') redo()
    else return
    e.preventDefault()
})

// add a wire pixel; drawing across a perpendicular wire makes a crossing
function add_wire(f, x, y, direction) {
    if (direction == 'horz') {
        if (f[x * 4 + (y + 0) * W * 4] == things.wire.code &&
            f[x * 4 + (y - 1) * W * 4] == things.wire.code &&
            f[x * 4 + (y + 1) * W * 4] == things.wire.code) {
            f[x * 4 + (y + 0) * W * 4 + 0] = things.cross_gate.code
            f[x * 4 + (y + 0) * W * 4 + 1] = 0
            f[x * 4 + (y + 0) * W * 4 + 2] = 0
            f[x * 4 + (y + 0) * W * 4 + 3] = 0
            return
        }
    }
    if (direction == 'vert') {
        if (f[(x + 0) * 4 + y * W * 4] == things.wire.code &&
            f[(x - 1) * 4 + y * W * 4] == things.wire.code &&
            f[(x + 1) * 4 + y * W * 4] == things.wire.code) {
            f[x * 4 + (y + 0) * W * 4 + 0] = things.cross_gate.code
            f[x * 4 + (y + 0) * W * 4 + 1] = 0
            f[x * 4 + (y + 0) * W * 4 + 2] = 0
            f[x * 4 + (y + 0) * W * 4 + 3] = 0
            return
        }
    }
    f[x * 4 + y * W * 4 + 0] = things.wire.code
    f[x * 4 + y * W * 4 + 1] = 0
    f[x * 4 + y * W * 4 + 2] = 0
    f[x * 4 + y * W * 4 + 3] = 0
}

// erase the pixel at x, y, or a big piece covering it
function erase_at(f, x, y) {
    for (var dy = 0; dy <= 2; dy++) {
        for (var dx = -2; dx <= 0; dx++) {
            let thing = code_to_thing[f[(x + dx) * 4 + (y + dy) * W * 4]]
            if ((dx == 0 && dy == 0) || things[thing]?.big) {
                f[(x + dx) * 4 + (y + dy) * W * 4 + 0] = 0
                f[(x + dx) * 4 + (y + dy) * W * 4 + 1] = 0
                f[(x + dx) * 4 + (y + dy) * W * 4 + 2] = 0
                f[(x + dx) * 4 + (y + dy) * W * 4 + 3] = 0
            }
        }
    }
}

function pos_to_cell(pos) {
    var scrollable_div = bottom_d
    return {
        x : Math.floor((pos.x + scrollable_div.scrollLeft) * devicePixelRatio / view.scale),
        y : H - Math.floor((pos.y + scrollable_div.scrollTop) * devicePixelRatio / view.scale) - 1
    }
}

function my_on_mouse_up(pos, e) {
    if (view.brush == 'hand') return
    var {x, y} = pos_to_cell(pos)

    if (view.brush == 'toggle_toggle') {
        draw_on_chip(f => {
            // flip just one toggle: the small toggle that was clicked, or
            // else the big (3x3) toggle covering the clicked cell
            var hit = null
            if (code_to_thing[f[x * 4 + y * W * 4]] == 'small_toggle') hit = x * 4 + y * W * 4
            for (var dy = 0; dy <= 2 && hit == null; dy++)
                for (var dx = -2; dx <= 0 && hit == null; dx++)
                    if (code_to_thing[f[(x + dx) * 4 + (y + dy) * W * 4]] == 'toggle') hit = (x + dx) * 4 + (y + dy) * W * 4
            if (hit != null) f[hit + 1] = f[hit + 1] > 0 ? 0 : 255
        }, { history : false })
    } else if (view.brush == 'flip') {
        draw_on_chip(f => {
            // flip the wire pixel nearest the click (within 2 px); the
            // simulation then carries the new state along the whole wire
            let hit = null
            for (let r = 0; r <= 2 && hit == null; r++)
                for (let dy = -r; dy <= r && hit == null; dy++)
                    for (let dx = -r; dx <= r && hit == null; dx++) {
                        if (Math.max(Math.abs(dx), Math.abs(dy)) != r) continue
                        if (x + dx < 0 || x + dx >= W || y + dy < 0 || y + dy >= H) continue
                        let i = (x + dx) * 4 + (y + dy) * W * 4
                        if (f[i] == things.wire.code) hit = i
                    }
            if (hit == null) return
            f[hit + 1] = f[hit + 1] ? 0 : 255
            f[hit + 2] = 255
        }, { history : false })
    } else if (view.brush == 'box') {
        draw_on_chip(f => {
            if (e.shiftKey && view.box && view.box.length == 4) {
                draw_on_chip(f => {
                    if (e.metaKey) {
                        for (let x = view.box[0]; x <= view.box[2]; x++)
                            for (let y = view.box[1]; y <= view.box[3]; y++)
                                for (let i = 0; i < 4; i++)
                                    f[x*4 + y*W*4 + i] = 0
                    }
                    view.box = [x, y - (view.box[3] - view.box[1]), view.box[2] - view.box[0] + x, y]

                    var ii = 0
                    for (let x = view.box[0]; x <= view.box[2]; x++)
                        for (let y = view.box[1]; y <= view.box[3]; y++)
                            for (let i = 0; i < 4; i++)
                                f[x*4 + y*W*4 + i] = view.copy[ii++]
                })
            } else {
                if (!view.box || view.box.length == 4) {
                    view.box = [x, y]
                } else {
                    view.box = [
                        Math.min(view.box[0], x),
                        Math.min(view.box[1], y),
                        Math.max(view.box[0], x),
                        Math.max(view.box[1], y)
                    ]
                    view.copy = []
                    draw_on_chip(f => {
                        for (var x = view.box[0]; x <= view.box[2]; x++)
                            for (var y = view.box[1]; y <= view.box[3]; y++)
                                for (var i = 0; i < 4; i++)
                                    view.copy.push(f[x*4 + y*W*4 + i])
                    })
                }
            }
        })
    } else if (view.brush == 'delete') {
        draw_on_chip(f => {
            if (e.shiftKey) {
                function delete_wires_at(x, y) {
                    if (f[x * 4 + y * W * 4] == things.cross_gate.code) {
                        f[x * 4 + y * W * 4 + 0] = things.wire.code
                    } else {
                        f[x * 4 + y * W * 4 + 0] = 0
                        f[x * 4 + y * W * 4 + 1] = 0
                        f[x * 4 + y * W * 4 + 2] = 0
                        f[x * 4 + y * W * 4 + 3] = 0
                    }
                }
                var dx = x - view.prev_x
                var dy = y - view.prev_y
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0)
                        for (var i = view.prev_x; i <= x; i++)
                            delete_wires_at(i, view.prev_y)
                    else
                        for (var i = x; i <= view.prev_x; i++)
                            delete_wires_at(i, view.prev_y)
                } else {
                    if (dy > 0)
                        for (var i = view.prev_y; i <= y; i++)
                            delete_wires_at(view.prev_x, i)
                    else
                        for (var i = y; i <= view.prev_y; i++)
                            delete_wires_at(view.prev_x, i)
                }
            } else {
                erase_at(f, x, y)
            }
        })
    } else if (view.brush == 'wire') {
        draw_on_chip(f => {
            if (e.shiftKey) {
                var dx = x - view.prev_x
                var dy = y - view.prev_y
                if (Math.abs(dx) > Math.abs(dy)) {
                    y = view.prev_y
                    if (dx > 0) {
                        for (var i = view.prev_x; i <= x; i++)
                            add_wire(f, i, y, 'horz')
                    } else {
                        for (var i = x; i <= view.prev_x; i++)
                            add_wire(f, i, y, 'horz')
                    }
                } else {
                    x = view.prev_x
                    if (dy > 0) {
                        for (var i = view.prev_y; i <= y; i++)
                            add_wire(f, x, i, 'vert')
                    } else {
                        for (var i = y; i <= view.prev_y; i++)
                            add_wire(f, x, i, 'vert')
                    }
                }
            } else {
                if (f[x * 4 + y * W * 4 + 0] != things.wire.code) {
                    f[x * 4 + y * W * 4 + 0] = things.wire.code
                    f[x * 4 + y * W * 4 + 1] = 0
                    f[x * 4 + y * W * 4 + 2] = 0
                    f[x * 4 + y * W * 4 + 3] = 0
                } else {
                    if (!f[x * 4 + y * W * 4 + 2]) f[x * 4 + y * W * 4 + 1] = f[x * 4 + y * W * 4 + 1] ? 0 : 255
                    f[x * 4 + y * W * 4 + 2] = f[x * 4 + y * W * 4 + 2] ? 0 : 255
                }
            }
        })
    } else {
        draw_on_chip(f => {
            f[x * 4 + y * W * 4 + 0] = things[view.brush].code
            f[x * 4 + y * W * 4 + 1] = 0
            f[x * 4 + y * W * 4 + 2] = 0
            f[x * 4 + y * W * 4 + 3] = things[view.brush].big ? 255 : 0
        })
    }
    
    view.prev_x = x
    view.prev_y = y
}

        y += e.offsetTop

    }

}

    overlay_dirty = false
    var b = bottom_d.getBoundingClientRect()
    var cw = bottom_d.clientWidth, ch = bottom_d.clientHeight
    var dpr = devicePixelRatio
    overlay.style.left = b.left + 'px'
    overlay.style.top = b.top + 'px'
    overlay.style.width = cw + 'px'
    overlay.style.height = ch + 'px'
    if (overlay.width != Math.round(cw * dpr)) overlay.width = Math.round(cw * dpr)
    if (overlay.height != Math.round(ch * dpr)) overlay.height = Math.round(ch * dpr)
    og.setTransform(1, 0, 0, 1, 0, 0)
    og.clearRect(0, 0, overlay.width, overlay.height)

    var cs = view.scale / dpr
    var gate_px = cs * 3
    if (gate_px < overlay_min_gate_px) return
    var fade_end = overlay_min_gate_px * overlay_fade_ratio
    var alpha = Math.min(1, (gate_px - overlay_min_gate_px) / (fade_end - overlay_min_gate_px))

    // read just the visible part of the board (plus a margin for pins)
    var r = c.getBoundingClientRect()
    var x0 = Math.max(0, Math.floor((b.left - r.left) / cs) - 4)
    var x1 = Math.min(W - 1, Math.ceil((b.left + cw - r.left) / cs) + 4)
    var row0 = Math.floor((b.top - r.top) / cs) - 4
    var row1 = Math.ceil((b.top + ch - r.top) / cs) + 4
    var y0 = Math.max(0, H - 1 - row1), y1 = Math.min(H - 1, H - 1 - row0)
    if (x1 < x0 || y1 < y0) return
    var w = x1 - x0 + 1, h = y1 - y0 + 1
    var px = new Uint8Array(w * h * 4)
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb2)
    gl.readPixels(x0, y0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px)

    function at(x, y) {
        if (x < x0 || x > x1 || y < y0 || y > y1) return null
        var i = ((x - x0) + (y - y0) * w) * 4
        return { code : px[i], on : px[i + 1] > 0 }
    }

    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
        var t = at(x, y)
        var kind = gate_kinds[code_to_thing[t.code]]
        if (!kind) continue

        // the anchor (x, y) is the gate's top-left cell; local (lx, ly)
        // maps to board cell (x + 1 + lx, y - 1 - ly)
        var cell = (lx, ly) => at(x + 1 + lx, y - 1 - ly)
        var is_wire = (lx, ly) => { var q = cell(lx, ly); return q && q.code == things.wire.code ? q : null }

        var outs = Object.keys(output_pins).filter(k => is_wire(...output_pins[k]))
        var ins = input_pins.filter(p => is_wire(...p))
        // a NAND with a single input is a NOT
        if (kind == 'NAND' && ins.length == 1) kind = 'NOT'

        // face the output wire; with no output wire, face away from the inputs
        var side = outs[0]
        if (!side) {
            var mx = ins.reduce((s, p) => s + p[0], 0), my = ins.reduce((s, p) => s + p[1], 0)
            side = Math.abs(mx) >= Math.abs(my) ? (mx > 0 ? 'left' : 'right') : (my > 0 ? 'top' : 'bottom')
        }
        var ang = output_angle[side]
        var cos = Math.cos(-ang), sin = Math.sin(-ang)
        var rot = p => [p[0] * cos - p[1] * sin, p[0] * sin + p[1] * cos]

        var sx = r.left - b.left + (x + 1.5) * cs
        var sy = r.top - b.top + (H - 1 - (y - 1) + 0.5) * cs
        og.setTransform(cs * dpr, 0, 0, cs * dpr, sx * dpr, sy * dpr)
        og.rotate(ang)
        // flat ends, so lines stop exactly at the block edge
        og.lineCap = 'butt'
        og.lineJoin = 'round'

        // the symbol is drawn at 75% so the wires have room around it
        var S = 0.75
        var back_x = kind == 'OR' ? (yy => S * (-1 + 0.22 * (1 - (yy / S / 0.9) ** 2))) : (yy => -S)
        // the inverting bubble sits just touching the tip of the body
        var bubble_r = 0.17
        var body_tip = kind == 'NAND' ? 0.82 : kind == 'NOT' ? 0.7 : 1.0
        var inverted = kind == 'NAND' || kind == 'NOT'
        var tip_x = S * (inverted ? body_tip + 2 * bubble_r : body_tip)

        // every line is drawn once, opaque: black when the gate is on,
        // white when it's off. While fading in, the colour is mixed from the
        // gate's own colour (still opaque, so overlapping lines don't stack)
        // a fixed fraction of a cell at every zoom, like a physical etching
        var groove = 0.06
        var base = t.on ? things[code_to_thing[t.code]].on : things[code_to_thing[t.code]].off
        var target = t.on ? [0, 0, 0] : [255, 255, 255]
        var line_color = rgb(base.map((v, i) => Math.round(v + (target[i] - v) * alpha)))
        function etch(path_fn, width) {
            path_fn()
            og.lineWidth = width || groove
            og.strokeStyle = line_color
            og.stroke()
        }

        // wires are etched thin when off and bold when on
        var wire_width = on => on ? groove * 2 : groove * 0.8
        var to_edge = v => Math.max(-1.5, Math.min(1.5, v))
        var to_ring = v => Math.max(-1.3, Math.min(1.3, v))

        // input wires. Each input goes around the side of the symbol it's
        // on (above or below the gate's axis) to the back. Within a side,
        // the wire with the longest trip gets the innermost track and the
        // outermost spot on the back; shorter trips nest outside it. Nested
        // like that, no two wires cross or share a track.
        var local_ins = ins.map(p => ({ q : rot(p).map(Math.round), on : is_wire(...p).on }))
        ;[-1, 1].forEach(side => {
            // work in a frame where this side is up (y < 0)
            var group = local_ins.filter(w => Math.sign(w.q[1]) == side)
                .map(w => ({ x : w.q[0], y : w.q[1] * -side, on : w.on }))
            // how far round from the back each pin is: 0 at the back, pi at the front
            group.forEach(w => w.d = Math.atan2(-w.y, -w.x))
            group.sort((a, b) => b.d - a.d)
            var n = group.length
            group.forEach((w, r) => {
                // tracks are spread evenly between 1.0 and 1.4 from the centre
                var lane = 1.0 + (r + 0.5) * 0.4 / n
                // spread over this side's half of the back, or the whole back
                // when every input comes from this side
                var span = n == local_ins.length ? 1.3 : 0.5
                var ay = local_ins.length == 1 ? 0 : S * (-0.65 + (r + 0.5) * span / n)
                // entry point on the block edge next to the pin
                var e = Math.abs(w.x) == 2 ? [Math.sign(w.x) * 1.5, w.y] : [w.x, -1.5]
                var pts = [e]
                if (e[0] == -1.5) {
                    pts.push([-lane, e[1]])
                } else if (e[0] == 1.5) {
                    pts.push([lane, e[1]], [lane, -lane], [-lane, -lane])
                } else {
                    pts.push([e[0], -lane], [-lane, -lane])
                }
                pts.push([-lane, ay], [back_x(ay), ay])
                etch(() => {
                    og.beginPath()
                    pts.forEach(([x, y], i) => i ? og.lineTo(x, y * -side) : og.moveTo(x, y * -side))
                }, wire_width(w.on))
            })
        })

        // output wires: the main one straight out, any others branch off it;
        // all carry the gate's output
        etch(() => {
            og.beginPath()
            og.moveTo(tip_x, 0)
            og.lineTo(1.5, 0)
            outs.slice(1).forEach(k => {
                var q = rot(output_pins[k])
                var qy = q[1] < 0 ? -1.3 : q[1] > 0 ? 1.3 : 0
                og.moveTo(1.3, 0)
                og.lineTo(1.3, qy)
                og.lineTo(to_ring(q[0]), qy)
                og.lineTo(to_edge(q[0]), to_edge(q[1]))
            })
        }, wire_width(t.on))

        // gate body
        var body = () => {
            og.save()
            og.scale(S, S)
            og.beginPath()
            if (kind == 'OR') {
                og.moveTo(-1, -0.9)
                og.quadraticCurveTo(0.35, -0.9, 1, 0)
                og.quadraticCurveTo(0.35, 0.9, -1, 0.9)
                og.quadraticCurveTo(-0.6, 0, -1, -0.9)
            } else if (kind == 'NOT') {
                og.moveTo(-1, -0.8)
                og.lineTo(body_tip, 0)
                og.lineTo(-1, 0.8)
                og.closePath()
            } else {
                var shift = kind == 'NAND' ? -0.18 : 0
                og.moveTo(-1, -0.9)
                og.lineTo(0.1 + shift, -0.9)
                og.arc(0.1 + shift, 0, 0.9, -Math.PI / 2, Math.PI / 2)
                og.lineTo(-1, 0.9)
                og.closePath()
            }
            if (inverted) {
                og.moveTo(body_tip + 2 * bubble_r, 0)
                og.arc(body_tip + bubble_r, 0, bubble_r, 0, Math.PI * 2)
            }
            og.restore()
        }
        etch(body)

        // label, kept upright, same colour as the lines
        var label_alpha = Math.min(alpha, (gate_px - label_fade_from_px) / (label_fade_to_px - label_fade_from_px))
        if (label_alpha > 0) {
            og.save()
            og.translate(S * (kind == 'OR' ? -0.15 : kind == 'NOT' ? -0.45 : -0.3), 0)
            og.rotate(-ang)
            og.font = 'bold ' + (kind == 'NOT' ? 0.26 : 0.34) + 'px sans-serif'
            og.textAlign = 'center'
            og.textBaseline = 'middle'
            og.fillStyle = rgb(base.map((v, i) => Math.round(v + (target[i] - v) * label_alpha)))
            og.fillText(kind, 0, 0)
            og.restore()
        }
    }
}
</script>
